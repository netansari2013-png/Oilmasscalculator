
name: Build Oil Calculator APK

on:
  workflow_dispatch:
  push:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Find and extract project ZIP
        run: |
          ZIP=$(find . -maxdepth 2 -iname "*.zip" | head -n 1)
          if [ -z "$ZIP" ]; then
            echo "Project ZIP not found"
            exit 1
          fi
          mkdir extracted
          unzip -q "$ZIP" -d extracted
          PROJECT=$(find extracted -name settings.gradle -printf '%h\n' | head -n 1)
          echo "PROJECT=$PROJECT" >> $GITHUB_ENV

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.7'

      - name: Build APK
        run: |
          cd "$PROJECT"
          gradle assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: OilMassCalculator-APK
          path: extracted/**/app/build/outputs/apk/debug/app-debug.apk
